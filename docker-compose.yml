# YoutubeWatchr online server. Start: put ADMIN_PASSWORD into .env, then `docker compose up -d`.
# With ADMIN_PASSWORD left empty, the editor opens without a login.
# It is reachable at http://<server>:8974 afterwards, or at the PORT from .env (for Nginx Proxy Manager: forward that port,
# turn on "Websockets Support"). Keys and settings are kept in data/.
services:
  youtubewatchr:
    image: node:22-alpine
    container_name: youtubewatchr
    restart: unless-stopped
    working_dir: /app
    command: node server.js
    env_file: .env
    environment:
      ONLINE: "1"
    ports:
      - "${PORT:-8974}:${PORT:-8974}"
    volumes:
      - .:/app
