<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · YoutubeWatchr</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<!-- Login for the editor on the online server. Same look as the editor: dark card, red accent. -->
<style>
  :root {
    --bg: #0d0f17; --panel: #161a26; --panel2: #1c2130; --line: #262c3d; --fg: #e9ecf5; --muted: #8d95ad; --accent: #ff0033; --danger: #ff5a6e;
    --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; color: var(--fg); font: 16px/1.6 var(--body);
    background: radial-gradient(900px 500px at 50% -10%, rgba(255, 0, 51, .13), transparent 70%), var(--bg); }
  .login { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 32px 28px 28px; box-shadow: 0 24px 60px rgba(0, 0, 0, .35); }
  .logo { display: block; height: 36px; width: auto; margin-bottom: 28px; }
  .eyebrow { font: 500 13px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  h1 { font: 700 32px/1.1 var(--display); margin: 12px 0 8px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 15px; }
  label { display: block; font: 600 13px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  label span { display: block; margin-bottom: 8px; }
  input { display: block; width: 100%; font: 500 17px/1.2 var(--body); color: var(--fg); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 13px 14px; margin-bottom: 18px; }
  input:hover { border-color: var(--muted); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { width: 100%; font: 700 15px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 15px 20px; cursor: pointer; transition: box-shadow .2s; }
  button:hover { box-shadow: 0 8px 24px rgba(255, 0, 51, .35); }
  button:disabled { opacity: .6; cursor: wait; box-shadow: none; }
  .msg { min-height: 1.5em; margin: 14px 0 0; color: var(--danger); font-size: 15px; }
  .msg.info { color: var(--muted); }
  @media (max-width: 400px) { .login { padding: 26px 20px 22px; } }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
  <form class="login" id="form" novalidate>
    <img class="logo" src="/logo.svg" alt="YoutubeWatchr" width="176" height="36">
    <div class="eyebrow" data-i18n="eyebrow">Overlay editor</div>
    <h1 data-i18n="signIn">Sign in</h1>
    <p class="sub" data-i18n="sub">After signing in you go straight to the editor for your OBS overlay.</p>
    <label><span data-i18n="user">User name</span><input id="user" autocomplete="username" autofocus></label>
    <label><span data-i18n="password">Password</span><input id="password" type="password" autocomplete="current-password"></label>
    <button type="submit" id="submit" data-i18n="signIn">Sign in</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
<script>
const $ = id => document.getElementById(id);
const show = (text, info) => { $('msg').textContent = text || ''; $('msg').className = info ? 'msg info' : 'msg'; };

// Only allow paths on this server as the target
const query = new URLSearchParams(location.search);
let next = query.get('next') || '';
if (!/^\/(?![\/\\])/.test(next)) next = '/editor';

// ---- languages: like the editor, from the link (?lang=de), then the last choice, otherwise English
const T = {
  en: {
    title: 'Sign in · YoutubeWatchr', eyebrow: 'Overlay editor', signIn: 'Sign in',
    sub: 'After signing in you go straight to the editor for your OBS overlay.',
    user: 'User name', password: 'Password',
    disabled: 'Sign-in is not set up on this server yet: put ADMIN_PASSWORD into the .env file and restart it.',
    empty: 'Please enter your user name and password.', wrong: 'Wrong user name or password.',
    locked: 'Too many attempts. Please try again in 15 minutes.', failed: 'Sign-in failed.', offline: 'The server is not reachable.',
  },
  de: {
    title: 'Anmelden · YoutubeWatchr', eyebrow: 'Overlay-Editor', signIn: 'Anmelden',
    sub: 'Nach der Anmeldung kommst du direkt in den Editor für dein OBS-Overlay.',
    user: 'Benutzername', password: 'Passwort',
    disabled: 'Die Anmeldung ist auf diesem Server noch nicht eingerichtet: Trage ADMIN_PASSWORD in die .env-Datei ein und starte ihn neu.',
    empty: 'Bitte gib Benutzername und Passwort ein.', wrong: 'Benutzername oder Passwort ist falsch.',
    locked: 'Zu viele Versuche. Bitte versuche es in 15 Minuten noch einmal.', failed: 'Anmeldung fehlgeschlagen.', offline: 'Der Server ist nicht erreichbar.',
  },
  ru: {
    title: 'Вход · YoutubeWatchr', eyebrow: 'Редактор оверлея', signIn: 'Войти',
    sub: 'После входа ты сразу попадёшь в редактор своего оверлея для OBS.',
    user: 'Имя пользователя', password: 'Пароль',
    disabled: 'Вход на этом сервере ещё не настроен: впиши ADMIN_PASSWORD в файл .env и перезапусти сервер.',
    empty: 'Введи имя пользователя и пароль.', wrong: 'Неверное имя пользователя или пароль.',
    locked: 'Слишком много попыток. Попробуй снова через 15 минут.', failed: 'Не удалось войти.', offline: 'Сервер недоступен.',
  },
  fr: {
    title: 'Connexion · YoutubeWatchr', eyebrow: 'Éditeur d\'overlay', signIn: 'Se connecter',
    sub: 'Après la connexion, tu arrives directement dans l\'éditeur de ton overlay OBS.',
    user: 'Nom d\'utilisateur', password: 'Mot de passe',
    disabled: 'La connexion n\'est pas encore configurée sur ce serveur : ajoute ADMIN_PASSWORD dans le fichier .env et redémarre-le.',
    empty: 'Saisis ton nom d\'utilisateur et ton mot de passe.', wrong: 'Nom d\'utilisateur ou mot de passe incorrect.',
    locked: 'Trop de tentatives. Réessaie dans 15 minutes.', failed: 'Échec de la connexion.', offline: 'Le serveur est injoignable.',
  },
};
let lang = query.get('lang') || new URLSearchParams(next.split('?')[1] || '').get('lang') || '';
try { if (!Object.hasOwn(T, lang)) lang = localStorage.getItem('yw-lang') || ''; } catch {}
if (!Object.hasOwn(T, lang)) lang = 'en';
const t = key => T[lang][key];
document.documentElement.lang = lang;
document.title = t('title');
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });

fetch('/api/me', { cache: 'no-store' }).then(r => r.json()).then(me => {
  if (!me.online || me.user) location.replace(next);
  else if (!me.loginEnabled) show(t('disabled'), true);
}).catch(() => {});

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const user = $('user').value.trim(), password = $('password').value;
  if (!user || !password) return show(t('empty'));
  $('submit').disabled = true;
  show('');
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user, password }) });
    if (r.ok) return location.replace(next);
    show(t({ 503: 'disabled', 429: 'locked', 401: 'wrong' }[r.status] || 'failed'));
    $('password').value = '';
  } catch {
    show(t('offline'));
  } finally {
    $('submit').disabled = false;
  }
});
</script>
</body>
</html>
